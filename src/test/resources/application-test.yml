spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-jwt-token-generation-and-validation-in-tests-environment
  expiration: 900000

logging:
  level:
    root: ERROR
    com.supera.accessrequest: DEBUG

